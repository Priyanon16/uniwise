services:
  mbs-retriever:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mbs-retriever
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Mount the directory, not one file. This lets the container see
      # replacements from editors/git pull as well as in-place edits.
      - ./data:/app/data:ro
      - retriever_cache:/app/.retriever_cache
    networks:
      - dify_net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import requests; requests.get('http://127.0.0.1:8000/health', timeout=10).raise_for_status()\""]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s

volumes:
  retriever_cache:

networks:
  dify_net:
    external: true
    name: ${DIFY_NETWORK}
