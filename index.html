<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <script>
    // Apply the preferred colour scheme before the page paints.
    try {
      const p = localStorage.getItem('mbs_uniwise_theme') || 'system';
      const dark = p === 'dark' || (p !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    } catch (_) {document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';}
  </script>
  <meta name="description" content="MBS UniWise AI ผู้ช่วยตอบคำถามคณะการบัญชีและการจัดการ มหาวิทยาลัยมหาสารคาม">
  <title>MBS UniWise AI — แชทและประวัติการสนทนา</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {font-family:Prompt,Tahoma,Arial,sans-serif;color-scheme:light;--primary:#1558c7;--primary-soft:#eaf2ff;--ink:#1e293b;--muted:#68778a;--stroke:#e8edf3;--sidebar:#f7f9fc;--main:#ffffff;--shadow:0 6px 28px rgba(22,49,81,.07)}
    *{box-sizing:border-box}
    html,body{height:100%;width:100%;padding:0;margin:0}
    body{background:#fff;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
    button,input,textarea{font:inherit}
    button{cursor:pointer}
    button:disabled{cursor:not-allowed;opacity:.5}
    button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #97beff;outline-offset:2px}
    a{color:var(--primary)}
    .layout{height:100vh;height:100dvh;display:flex;overflow:hidden;background:var(--main)}
    .sidebar{width:282px;flex:none;display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--sidebar);border-right:1px solid var(--stroke);transition:width .2s ease,transform .2s ease}
    .sidebar.collapsed{width:0;overflow:hidden;border-right:0}
    .side-head{padding:22px 16px 12px}
    .brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:inherit;min-width:0}
    .school-logo{display:block;width:47px;height:47px;object-fit:contain;flex-shrink:0;padding:3px;background:white;border:1px solid #e4eaf4;border-radius:12px}
    .logo-alt{display:none;width:47px;height:47px;align-items:center;justify-content:center;flex-shrink:0;border-radius:12px;background:#1c64f2;color:white;font-size:13px;font-weight:700}
    .brand-title{font-weight:700;font-size:15px;line-height:1.5;white-space:nowrap}
    .brand-subtitle{color:#8390a4;font-size:10px;line-height:1.6;max-width:175px}
    .side-tools{padding:7px 12px 15px;display:grid;gap:8px}
    .button-new{border:0;border-radius:12px;padding:12px 15px;display:flex;align-items:center;justify-content:center;gap:9px;background:var(--primary);color:white;font-size:12px;font-weight:600;min-height:44px;box-shadow:0 5px 15px #175bd21a}
    .button-new:hover{background:#104dac}
    .search-box{position:relative}
    .search-box input{width:100%;height:42px;border:1px solid #e2e8f1;border-radius:11px;background:#fff;padding:9px 12px 9px 34px;font-size:11.5px;outline:none;color:var(--ink)}
    .search-box input:focus{border-color:#9abcf4}
    .search-mark{position:absolute;top:50%;left:12px;transform:translateY(-50%);font-size:17px;color:#8491a5;line-height:1}
    .side-scroll{padding:4px 10px 12px;overflow-y:auto;overflow-x:hidden;min-height:0;flex:1;overscroll-behavior:contain}
    .section-title{margin:15px 10px 7px;font-size:10.5px;font-weight:600;color:#8b96a7}
    .history-row{display:flex;align-items:center;gap:0;min-width:0;min-height:40px;border-radius:10px;margin:3px 0}
    .history-row:hover{background:#eaf0f9}
    .history-row.active{background:#e5edfa}
    .history-open{display:block;text-align:left;flex:1;min-width:0;background:transparent;border:0;padding:10px 8px 10px 12px;font-size:11.5px;line-height:1.55;color:#334155;text-overflow:ellipsis;white-space:nowrap;overflow:hidden}
    .history-row.active .history-open{color:#0d4da7;font-weight:600}
    .more-button{font-size:18px;line-height:1;flex:none;width:31px;height:32px;margin-right:3px;border:0;background:transparent;color:#738298;border-radius:8px}
    .more-button:hover{background:#dbe6f7;color:#1a4e92}
    .hint-empty{color:#8693a7;font-size:11px;line-height:1.9;padding:14px 12px}
    .side-guide{border-top:1px solid var(--stroke);padding:14px 15px 17px;flex:none}
    .guide-summary{display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:600;color:#496484;cursor:pointer;list-style:none;padding:2px 0}
    .guide-summary::-webkit-details-marker{display:none}
    .guide-summary::after{content:'⌄';font-size:17px;color:#8b98ad}
    details[open] .guide-summary::after{content:'⌃'}
    .guide-list{display:grid;gap:5px;padding:9px 0 0;max-height:185px;overflow-y:auto}
    .guide-item{background:#fff;border:1px solid #e6edf6;border-radius:9px;text-align:left;font-size:10.5px;line-height:1.65;color:#476385;padding:8px 10px}
    .guide-item:hover{border-color:#a1bff1;color:#1658bb}
    .side-meta{font-size:9.5px;color:#9ca8b8;line-height:1.7;margin:10px 0 0}
    .main{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;position:relative;background:#fff}
    .header{flex:none;min-height:66px;border-bottom:1px solid #f1f3f7;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 22px}
    .header-left{display:flex;align-items:center;gap:12px;min-width:0}
    .header-titles{min-width:0}
    .header-title{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .header-sub{font-size:10.5px;color:#8a96a6;display:flex;align-items:center;gap:6px;margin-top:2px}
    .status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#c2cad7;flex-shrink:0}
    .status-dot.ready{background:#23bd81}
    .header-actions{display:flex;gap:5px;align-items:center;flex:none}
    .icon-btn{border:0;border-radius:10px;padding:8px;min-width:38px;min-height:38px;display:inline-flex;align-items:center;justify-content:center;background:transparent;color:#617186}
    .icon-btn:hover{background:#f0f4f9;color:#1857b6}
    .icon-btn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;stroke-width:1.7}
    .text-btn{border:1px solid #e7edf5;border-radius:10px;background:#fff;color:#547093;padding:9px 12px;min-height:37px;font-size:11px}
    .text-btn:hover{background:#f2f6fd}
    .status-alert{display:none;background:#fff7ed;color:#9a5a13;border-bottom:1px solid #ffebca;font-size:11px;line-height:1.7;text-align:center;padding:10px 16px}
    .status-alert.visible{display:block}
    .chat-scroll{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;scrollbar-gutter:stable;scroll-behavior:smooth}
    .chat-content{width:min(100%,790px);min-height:100%;margin:0 auto;padding:22px 22px 34px;display:flex;flex-direction:column}
    .welcome{margin:auto 0;padding:28px 0;flex:none;text-align:center}
    .welcome-seal{width:62px;height:62px;display:block;object-fit:contain;margin:0 auto 18px;padding:5px;border:1px solid #e8edf5;border-radius:19px;background:white;box-shadow:var(--shadow)}
    .welcome h1{font-size:clamp(22px,2.25vw,29px);font-weight:600;line-height:1.55;letter-spacing:-.2px;margin:0 0 9px;color:#1d314e}
    .welcome p{font-size:12px;line-height:1.9;color:#7a8a9e;margin:0 auto;max-width:590px}
    .quick-heading{text-align:left;font-size:11px;color:#6c7b8e;font-weight:600;margin:27px 0 10px}
    .prompt-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;text-align:left}
    .prompt{border:1px solid #e8ecf4;background:#fff;border-radius:12px;min-height:54px;padding:11px 13px;color:#43556e;text-align:left;font-size:11.5px;line-height:1.65;box-shadow:0 1px 5px rgba(25,43,71,.025);transition:border-color .15s,background .15s}
    .prompt:hover{border-color:#9ebff7;background:#f6faff;color:#174f9c}
    .message{display:flex;align-items:flex-start;gap:12px;margin:14px 0 23px;max-width:100%}
    .message.user{justify-content:flex-end;margin-top:19px;margin-bottom:22px}
    .message-inner{max-width:100%;min-width:0;flex:1}
    .message.user .message-inner{flex:0 1 auto;max-width:85%}
    .message-label{font-size:10.5px;font-weight:600;color:#54677e;margin:2px 0 7px}
    .message-copy{font-size:14px;line-height:2.0;white-space:pre-wrap;overflow-wrap:anywhere;color:#2c3747}
    .message.user .message-copy{background:#eff4fb;border:1px solid #ebf0f8;border-radius:17px;padding:10px 16px;font-size:13px;line-height:1.85}
    .message-actions{margin:7px 0 0;display:flex;gap:8px}
    .copy-btn{font-size:10px;color:#8c9caf;border:0;padding:4px 0;background:transparent}
    .copy-btn:hover{color:#1558c7}
    .thinking .message-copy{color:#8898ad}
    .dots::after{content:' ';display:inline-block;vertical-align:middle;width:24px;height:9px;background:radial-gradient(circle,#8b9db9 55%,transparent 60%) 0 50%/8px 8px repeat-x;animation:pulse 1.1s infinite alternate}
    @keyframes pulse{from{opacity:.35}to{opacity:1}}
    .composer-area{flex:none;padding:11px 24px max(13px,env(safe-area-inset-bottom));background:#fff}
    .composer-wrap{max-width:760px;margin:0 auto}
    .composer{display:flex;align-items:flex-end;gap:8px;padding:9px 10px 9px 16px;min-height:61px;background:#fff;border:1px solid #e2e8f1;border-radius:19px;box-shadow:0 3px 21px rgba(25,46,71,.095)}
    .composer:focus-within{border-color:#a2bff0;box-shadow:0 4px 25px rgba(25,82,167,.10)}
    #question{width:100%;flex:1;min-width:0;min-height:38px;max-height:166px;resize:none;border:0;outline:0!important;overflow-y:auto;padding:8px 0 3px;font-size:13px;line-height:1.8;color:#26374c;background:transparent}
    #question::placeholder{color:#9da9ba}
    .send-btn{width:39px;height:39px;border:0;border-radius:12px;background:#175fdf;color:white;display:grid;place-items:center;flex:none;margin-bottom:1px}
    .send-btn:hover{background:#1053c8}
    .send-btn svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .composer-note{text-align:center;color:#97a3b3;font-size:10px;line-height:1.65;margin:9px 0 0}
    .scrim{display:none}
    .toast{position:fixed;bottom:98px;left:50%;transform:translateX(-50%);background:#20304c;color:#fff;border-radius:11px;padding:11px 16px;z-index:80;box-shadow:0 12px 25px #1e365843;max-width:min(470px,92vw);text-align:center;font-size:11px;line-height:1.8}
    .dialog{border:0;border-radius:17px;padding:0;width:min(405px,calc(100vw - 34px));box-shadow:0 25px 80px #18345835}
    .dialog::backdrop{background:#11254377}
    .dialog-inner{padding:23px 23px 19px}
    .dialog h2{font-size:17px;margin:0 0 10px;color:#22334a}
    .dialog p{font-size:12px;color:#697c90;line-height:1.8}
    .dialog input{border:1px solid #dce5f0;border-radius:10px;width:100%;height:43px;padding:10px 11px;margin:7px 0;font-size:12px}
    .dialog-buttons{display:flex;justify-content:flex-end;gap:8px;margin-top:17px}
    .dialog-button{border:1px solid #e2e8f0;border-radius:10px;background:#fff;padding:10px 17px;font-size:12px;color:#41566e}
    .dialog-button.primary{border-color:#1c64f2;background:#1c64f2;color:#fff}
    .dialog-button.danger{border-color:#dc3545;background:#dc3545;color:#fff}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(max-width:900px){.sidebar{width:255px}.chat-content{padding-inline:16px}.header{padding-inline:14px}.composer-area{padding-inline:16px}}
    @media(max-width:740px){
      .sidebar{position:fixed;z-index:30;top:0;bottom:0;left:0;height:100vh;height:100dvh;width:min(310px,86vw);transform:translateX(-105%);box-shadow:12px 0 50px #1e345b28;transition:transform .22s ease}
      .sidebar.mobile-open{transform:translateX(0)}.sidebar.collapsed{width:min(310px,86vw);overflow:visible}
      .scrim.visible{display:block;position:fixed;inset:0;background:#102c4e6b;z-index:20;border:0}
      .main{width:100%}.header{min-height:58px}.header-title{font-size:14px}.header-sub{font-size:10px}
      .desktop-only{display:none}
      .chat-content{padding:12px 14px 26px}
      .composer-area{padding:10px 11px max(10px,env(safe-area-inset-bottom))}
      .message-copy{font-size:13px}.prompt-grid{grid-template-columns:1fr}.prompt{min-height:45px;padding:9px 12px}
      .welcome{padding:24px 0 15px}.welcome-seal{height:53px;width:53px;margin-bottom:12px}.welcome p{font-size:11px}.quick-heading{margin-top:21px}
      .composer{border-radius:17px;min-height:55px}.send-btn{height:37px;width:37px}
    }
    @media(max-width:375px){.header{padding-inline:8px}.header-sub{display:none}.header-title{font-size:13px}.header-actions{gap:0}.text-btn{padding:8px;font-size:10px}.chat-content{padding-inline:11px}.welcome h1{font-size:21px}.prompt-grid{gap:7px}.composer-note{font-size:9px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation:none!important;transition:none!important}}

    /* Theme tokens and dark-mode overrides */
    :root { --surface:#fff;--surface-subtle:#f7f9fc;--hover:#f0f4f9;--panel:#fff;--line:#e8edf3;--bubble:#eff4fb;--bubble-edge:#e9eef7;--title:#1d314e;--body-copy:#2c3747;--label:#54677e;--note:#8492a4;--pop-shadow:0 16px 40px rgba(19,33,60,.16); }
    :root[data-theme="dark"] {
      color-scheme:dark;
      --primary:#86b3ff;--primary-soft:#142947;--ink:#e8eef7;--muted:#a7b5c9;
      --stroke:#273244;--sidebar:#111926;--main:#0c111b;--shadow:0 6px 28px rgba(0,0,0,.25);
      --surface:#0c111b;--surface-subtle:#151f2e;--hover:#1f2c3d;--panel:#141d2b;
      --line:#2a3547;--bubble:#1d2c40;--bubble-edge:#2b3d54;--title:#e9f1ff;
      --body-copy:#e0e9f6;--label:#bbcae0;--note:#9cabc0;--pop-shadow:0 16px 48px rgba(0,0,0,.5);
    }
    :root[data-theme="dark"] body,
    :root[data-theme="dark"] .layout,
    :root[data-theme="dark"] .main,
    :root[data-theme="dark"] .composer-area{background:var(--main);color:var(--ink)}
    :root[data-theme="dark"] .header{background:var(--main);border-bottom-color:var(--stroke)}
    :root[data-theme="dark"] .brand-subtitle,
    :root[data-theme="dark"] .header-sub,
    :root[data-theme="dark"] .section-title,
    :root[data-theme="dark"] .quick-heading,
    :root[data-theme="dark"] .composer-note,
    :root[data-theme="dark"] .side-meta,
    :root[data-theme="dark"] .hint-empty,
    :root[data-theme="dark"] .welcome p{color:var(--note)}
    :root[data-theme="dark"] .history-row:hover,
    :root[data-theme="dark"] .icon-btn:hover{background:var(--hover);color:var(--ink)}
    :root[data-theme="dark"] .history-row.active{background:#213651}
    :root[data-theme="dark"] .history-open,
    :root[data-theme="dark"] .guide-summary,
    :root[data-theme="dark"] .icon-btn{color:#c1d0e5}
    :root[data-theme="dark"] .history-row.active .history-open{color:#9fc5ff}
    :root[data-theme="dark"] .more-button{color:#a1b1c5}
    :root[data-theme="dark"] .more-button:hover{background:#31435b;color:white}
    :root[data-theme="dark"] .search-box input,
    :root[data-theme="dark"] .guide-item,
    :root[data-theme="dark"] .text-btn,
    :root[data-theme="dark"] .prompt,
    :root[data-theme="dark"] .composer,
    :root[data-theme="dark"] .dialog,
    :root[data-theme="dark"] .dialog input,
    :root[data-theme="dark"] .dialog-button:not(.primary):not(.danger){background:var(--panel);border-color:var(--line);color:var(--ink)}
    :root[data-theme="dark"] .prompt:hover,
    :root[data-theme="dark"] .guide-item:hover,
    :root[data-theme="dark"] .text-btn:hover{background:#24334b;border-color:#48678c;color:#d4e7ff}
    :root[data-theme="dark"] .guide-item{color:#bdd2ed}
    :root[data-theme="dark"] .welcome h1,
    :root[data-theme="dark"] .dialog h2{color:var(--title)}
    :root[data-theme="dark"] .message-copy,
    :root[data-theme="dark"] #question{color:var(--body-copy)}
    :root[data-theme="dark"] .message-label{color:var(--label)}
    :root[data-theme="dark"] .message.user .message-copy{background:var(--bubble);border-color:var(--bubble-edge)}
    :root[data-theme="dark"] #question::placeholder{color:#8b9cb3}
    :root[data-theme="dark"] .composer{box-shadow:0 5px 22px #0005}
    :root[data-theme="dark"] .composer:focus-within{border-color:#6798e8;box-shadow:0 5px 25px #0008}
    :root[data-theme="dark"] .message-actions .copy-btn{color:#a6b5ce}
    :root[data-theme="dark"] .dialog p{color:#adbbce}
    :root[data-theme="dark"] .status-alert{background:#382b1f;color:#ffd39a;border-bottom-color:#6c533c}
    :root[data-theme="dark"] .scrim.visible{background:#020611b7}
    .header-actions{position:relative}
    .theme-menu{position:absolute;z-index:18;right:44px;top:calc(100% + 12px);padding:7px;display:grid;gap:3px;width:196px;background:var(--panel);border:1px solid var(--line);border-radius:13px;box-shadow:var(--pop-shadow)}
    .theme-menu[hidden]{display:none}
    .theme-option{display:flex;align-items:center;justify-content:space-between;gap:9px;width:100%;border:0;border-radius:9px;background:transparent;color:var(--ink);padding:10px 12px;font-size:12px;text-align:left}
    .theme-option:hover,.theme-option[aria-checked="true"]{background:var(--hover)}
    .theme-option[aria-checked="true"]{font-weight:600;color:var(--primary)}
    .theme-option[aria-checked="true"]::after{content:'✓';font-size:14px}
    #themeToggle[aria-expanded="true"]{background:var(--hover)}
    .mic-btn{position:relative;width:39px;height:39px;margin-bottom:1px;border:0;border-radius:12px;background:transparent;color:var(--label);display:grid;place-items:center;flex:none}
    .mic-btn:hover{background:var(--hover);color:var(--primary)}
    .mic-btn svg{width:21px;height:21px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .mic-btn.listening{background:#dcecff;color:#145fcb}
    :root[data-theme="dark"] .mic-btn.listening{background:#174574;color:#a8ceff}
    .mic-btn.listening::after{content:'';pointer-events:none;position:absolute;inset:-4px;border:2px solid currentColor;border-radius:15px;animation:micPulse 1s ease-in-out infinite alternate}
    @keyframes micPulse{from{opacity:.25;transform:scale(.96)}to{opacity:.85;transform:scale(1.03)}}
    #micStatus{display:block;min-height:0;margin:3px auto 0;text-align:center;font-size:11px;color:var(--primary);line-height:1.6}
    #micStatus:empty{display:none}
    .options-popup{position:fixed;z-index:50;background:var(--panel);border:1px solid var(--line);box-shadow:var(--pop-shadow);border-radius:12px;padding:6px;min-width:152px}
    .options-popup button{display:block;border:0;background:transparent;width:100%;text-align:left;padding:10px;border-radius:7px;font-size:12px;color:var(--ink)}
    .options-popup button:hover{background:var(--hover)}
    .options-popup .delete-option{color:#dd7180}
    @media(max-width:740px){.theme-menu{right:0;top:calc(100% + 10px)}.mic-btn{width:38px;height:38px}}

  </style>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar" aria-label="ประวัติการสนทนา">
    <div class="side-head">
      <div class="brand">
        <img class="school-logo" src="https://acad-mbs.msu.ac.th/mbs.png" alt="โลโก้คณะการบัญชีและการจัดการ" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
        <span class="logo-alt" aria-hidden="true">MBS</span>
        <div><div class="brand-title">MBS UniWise AI</div><div class="brand-subtitle">คณะการบัญชีและการจัดการ<br>มหาวิทยาลัยมหาสารคาม</div></div>
      </div>
    </div>
    <div class="side-tools">
      <button id="newSidebar" type="button" class="button-new"><span aria-hidden="true" style="font-size:20px;line-height:1">＋</span> แชทใหม่</button>
      <label class="search-box"><span class="search-mark" aria-hidden="true">⌕</span><span class="sr-only">ค้นหาประวัติการสนทนา</span><input id="search" type="search" placeholder="ค้นหาชื่อบทสนทนา..." autocomplete="off"></label>
    </div>
    <div class="side-scroll" id="historyScroll" aria-label="รายการสนทนาทั้งหมด">
      <div id="history"><p class="hint-empty">กำลังตรวจสอบประวัติการสนทนา...</p></div>
    </div>

        <div class="guide-list" id="guideList"></div>

      <p class="side-meta">ประวัติเก็บโดย Dify และแยกตามเบราว์เซอร์ ไม่ต้องเข้าสู่ระบบ</p>
    </div>

  <button id="scrim" class="scrim" type="button" aria-label="ปิดแถบประวัติ"></button>
  <div class="main">
    <header class="header">

        <button type="button" id="toggleSide" class="icon-btn" aria-label="เปิดหรือปิดประวัติสนทนา" title="เปิด/ปิดประวัติสนทนา">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
        </button>
        <div class="header-titles"><div class="header-title" id="currentTitle">MBS UniWise AI</div><div class="header-sub"><span id="statusDot" class="status-dot"></span><span id="statusText">ผู้ช่วยตอบคำถามคณะการบัญชีและการจัดการ</span></div></div>
      </div>
      <div class="header-actions">
        <button id="themeToggle" class="icon-btn" type="button" title="เปลี่ยนธีม" aria-label="เปลี่ยนธีม" aria-expanded="false" aria-controls="themeMenu" aria-haspopup="menu">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 15.4a8.4 8.4 0 0 1-11.6-11A8.5 8.5 0 1 0 20.2 15.4Z"/></svg>
        </button>
        <div id="themeMenu" class="theme-menu" role="menu" aria-label="เลือกธีม" hidden>
          <button class="theme-option" type="button" data-mode="system" role="menuitemradio" aria-checked="true">ตามธีมของเครื่อง</button>

          <svg viewBox="0 0 24 24"><path d="M8 3H4a1 1 0 0 0-1 1v4M16 3h4a1 1 0 0 1 1 1v4M3 16v4a1 1 0 0 0 1 1h4m13-5v4a1 1 0 0 1-1 1h-4"/></svg>
        </button>
      </div>
    </header>
    <div id="statusAlert" class="status-alert" role="status"></div>
    <div id="chatScroll" class="chat-scroll" tabindex="0" aria-label="ข้อความสนทนา">
      <div class="chat-content" id="chatContent"></div>
    </div>
    <div class="composer-area">
      <div class="composer-wrap">
        <form class="composer" id="form"><label class="sr-only" for="question">พิมพ์คำถาม</label><textarea id="question" rows="1" maxlength="8000" placeholder="ถาม MBS UniWise AI..." autocomplete="off"></textarea><button type="button" id="mic" class="mic-btn" title="พูดเพื่อพิมพ์คำถาม" aria-label="พูดเพื่อพิมพ์คำถาม" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="2.5" width="6" height="12" rx="3"/><path d="M5.5 10a6.5 6.5 0 0 0 13 0M12 16.5v4.5m-4 0h8"/></svg>
        </button><button class="send-btn" id="send" type="submit" title="ส่งข้อความ" aria-label="ส่งข้อความ"><svg viewBox="0 0 24 24"><path d="M12 19V5m0 0-6 6m6-6 6 6"/></svg></button></form>
        <div id="micStatus" role="status" aria-live="polite"></div>
        <p class="composer-note">คำตอบสร้างโดย AI โปรดตรวจสอบข้อมูลสำคัญกับประกาศทางการของคณะ</p>
      </div>
    </div>
  </div>
</div>
<dialog id="dialog" class="dialog" aria-labelledby="dialogTitle"><div class="dialog-inner"><h2 id="dialogTitle"></h2><p id="dialogMessage"></p><label for="dialogInput" id="dialogLabel" class="sr-only">ชื่อบทสนทนา</label><input id="dialogInput" maxlength="100"><div class="dialog-buttons"><button type="button" class="dialog-button" id="dialogCancel">ยกเลิก</button><button type="button" class="dialog-button primary" id="dialogOK">ยืนยัน</button></div></div></dialog>
<script>
  'use strict';
  const $=id=>document.getElementById(id);
  const STORE='mbs_uniwise_api_user_v3';
  const THEME_STORE='mbs_uniwise_theme';
  const systemTheme=window.matchMedia('(prefers-color-scheme: dark)');
  let themeChoice='system';
  try {const saved=localStorage.getItem(THEME_STORE);if(['system','light','dark'].includes(saved))themeChoice=saved} catch(_){}
  function applyTheme(){
    const active=themeChoice==='system'?(systemTheme.matches?'dark':'light'):themeChoice;
    document.documentElement.dataset.theme=active;
    document.querySelector('meta[name="theme-color"]').content=active==='dark'?'#0c111b':'#ffffff';
    document.querySelectorAll('.theme-option').forEach(el=>el.setAttribute('aria-checked',String(el.dataset.mode===themeChoice)));
    $('themeToggle').title='ธีมปัจจุบัน: '+(themeChoice==='system'?'ตามเครื่อง':themeChoice==='dark'?'มืด':'สว่าง');
  }
  function closeThemeMenu(){ $('themeMenu').hidden=true;$('themeToggle').setAttribute('aria-expanded','false') }
  $('themeToggle').onclick=()=>{
    const next=$('themeMenu').hidden;$('themeMenu').hidden=!next;$('themeToggle').setAttribute('aria-expanded',String(next));
    if(next)$('themeMenu').querySelector('[aria-checked="true"]')?.focus();
  };
  document.querySelectorAll('.theme-option').forEach(button=>button.addEventListener('click',()=>{
    themeChoice=button.dataset.mode;
    try{localStorage.setItem(THEME_STORE,themeChoice)}catch(_){}
    applyTheme();closeThemeMenu();$('themeToggle').focus();
  }));
  document.addEventListener('pointerdown',e=>{if(!$('themeMenu').hidden&&!$('themeMenu').contains(e.target)&&!$('themeToggle').contains(e.target))closeThemeMenu()});
  if(systemTheme.addEventListener)systemTheme.addEventListener('change',()=>{if(themeChoice==='system')applyTheme()});
  else if(systemTheme.addListener)systemTheme.addListener(()=>{if(themeChoice==='system')applyTheme()});
  applyTheme();

  const topics=[
    ['หลักสูตรและสาขาวิชา','คณะมีสาขาวิชาระดับปริญญาตรีอะไรบ้าง?'],
    ['การรับสมัครนักศึกษา','สมัครเข้าศึกษาระดับปริญญาตรีต้องทำอย่างไร?'],
    ['ปฏิทินการศึกษา','ภาคเรียนที่ 2 ปีการศึกษา 2569 ลงทะเบียนเรียนเมื่อไหร่?'],
    ['คู่มือการเรียน','การลาพักการศึกษาต้องดำเนินการอย่างไร?'],
    ['ฝึกงานและสหกิจศึกษา','สหกิจศึกษาต้องเตรียมเอกสารอะไรบ้าง?'],
    ['อาจารย์และบุคลากร','สาขาคอมพิวเตอร์ธุรกิจมีอาจารย์คนใดบ้าง?'],
    ['อาจารย์ที่ปรึกษา','ตรวจสอบรายชื่ออาจารย์ที่ปรึกษาได้อย่างไร?'],
    ['ติดต่อคณะ','ช่องทางติดต่อคณะการบัญชีและการจัดการมีอะไรบ้าง?']
  ];
  function anonymousId(){
    if(!crypto?.getRandomValues)throw Error('เบราว์เซอร์ไม่รองรับรหัสอุปกรณ์ที่ปลอดภัย');
    const bytes=new Uint8Array(16);crypto.getRandomValues(bytes);
    return 'mbs-'+Array.from(bytes,n=>n.toString(16).padStart(2,'0')).join('');
  }
  let userId;
  try {userId=localStorage.getItem(STORE);if(!/^mbs-[a-f0-9]{32}$/.test(userId||'')){userId=anonymousId();localStorage.setItem(STORE,userId)}}
  catch {userId=anonymousId()}
  let current='',conversations=[],sending=false,loadEpoch=0,loaded=false,displayError='';
  const history=$('history'),chat=$('chatContent'),scroll=$('chatScroll'),question=$('question');
  function toast(message){const old=document.querySelector('.toast');if(old)old.remove();const node=document.createElement('div');node.className='toast';node.role='status';node.textContent=message;document.body.append(node);setTimeout(()=>node.remove(),4300)}
  function mobile(){return window.matchMedia('(max-width:740px)').matches}
  function side(open){
    if(mobile()){$('sidebar').classList.toggle('mobile-open',open);$('scrim').classList.toggle('visible',open)}
    else{$('sidebar').classList.toggle('collapsed',!open)}
  }
  $('toggleSide').onclick=()=>mobile()?side(!$('sidebar').classList.contains('mobile-open')):side($('sidebar').classList.contains('collapsed'));
  $('scrim').onclick=()=>side(false);
  window.addEventListener('resize',()=>{if(!mobile()){$('sidebar').classList.remove('mobile-open');$('scrim').classList.remove('visible')}else $('sidebar').classList.remove('collapsed')});
  document.addEventListener('keydown',event=>{
    if(event.key==='Escape'){side(false);closeThemeMenu()}
    if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='k'){event.preventDefault();if(mobile())side(true);$('search').focus()}
    if((event.ctrlKey||event.metaKey)&&event.shiftKey&&event.key.toLowerCase()==='o'){event.preventDefault();newChat()}
  });
  function choosePrompt(text){question.value=text;resize();side(false);question.focus()}
  function promptButton(text,cls){const b=document.createElement('button');b.className=cls;b.type='button';b.textContent=text;b.onclick=()=>choosePrompt(text);return b}
  topics.forEach(([title,text])=>$('guideList').append(promptButton(`${title} — ${text}`,'guide-item')));
  function welcome(){
    chat.replaceChildren();const div=document.createElement('section');div.className='welcome';
    const logo=document.createElement('img');logo.src='https://acad-mbs.msu.ac.th/mbs.png';logo.alt='โลโก้คณะการบัญชีและการจัดการ';logo.className='welcome-seal';logo.onerror=()=>{logo.style.display='none'};
    const h=document.createElement('h1');h.textContent='สวัสดีค่ะ มีอะไรให้ช่วยเกี่ยวกับ MBS บ้าง?';
    const p=document.createElement('p');p.textContent='MBS UniWise AI ผู้ช่วยตอบคำถามเกี่ยวกับคณะการบัญชีและการจัดการ มหาวิทยาลัยมหาสารคาม';
    const t=document.createElement('div');t.className='quick-heading';t.textContent='ลองถามเรื่องเหล่านี้';
    const grid=document.createElement('div');grid.className='prompt-grid';
    [0,2,4,3,5,7].forEach(i=>grid.append(promptButton(topics[i][1],'prompt')));
    div.append(logo,h,p,t,grid);chat.append(div);scroll.scrollTop=0;
    $('currentTitle').textContent='MBS UniWise AI';
  }
  function nearBottom(){return scroll.scrollHeight-scroll.scrollTop-scroll.clientHeight<160}
  function scrollBottom(force=false){if(force||nearBottom())scroll.scrollTop=scroll.scrollHeight}
  function bubble(role,text,autos=true){
    const follow=nearBottom(),node=document.createElement('article');node.className='message '+role;
    const inner=document.createElement('div');inner.className='message-inner';
    if(role==='assistant'){const label=document.createElement('div');label.className='message-label';label.textContent='MBS UniWise AI';inner.append(label)}
    const value=document.createElement('div');value.className='message-copy';value.textContent=text||'';
    inner.append(value);node.append(inner);chat.append(node);if(autos&&follow)scrollBottom(true);
    return {node,body:value,inner};
  }
  function finishedAnswer(entry){
    const actions=document.createElement('div');actions.className='message-actions';
    const copy=document.createElement('button');copy.type='button';copy.className='copy-btn';copy.textContent='คัดลอกคำตอบ';
    copy.onclick=async()=>{try{await navigator.clipboard.writeText(entry.body.textContent);toast('คัดลอกคำตอบแล้ว')}catch{toast('ไม่สามารถคัดลอกได้ โปรดเลือกข้อความแทน')}};
    actions.append(copy);entry.inner.append(actions);
  }
  function setBusy(value){sending=value;$('send').disabled=value;question.disabled=value;$('newSidebar').disabled=value;$('newTop').disabled=value;if(value)stopListening();micButton.disabled=value||!SpeechAPI;}
  function resize(){question.style.height='auto';question.style.height=Math.min(166,Math.max(38,question.scrollHeight))+'px'}
  question.addEventListener('input',resize);
  // Dictation is performed by the browser's Web Speech API, not by Dify or our PHP proxy.
  // The user checks the transcript before clicking Send; audio is not stored by this page.
  const SpeechAPI=window.SpeechRecognition||window.webkitSpeechRecognition;
  let recognition=null,listening=false,dictationBase='',lastTranscript='',speechError='';
  const micButton=$('mic'),micStatus=$('micStatus');
  function setListening(value){
    listening=value;micButton.classList.toggle('listening',value);
    micButton.setAttribute('aria-pressed',String(value));
    micButton.setAttribute('aria-label',value?'หยุดฟังเสียง':'พูดเพื่อพิมพ์คำถาม');
    micButton.title=value?'หยุดฟังเสียง':'พูดเพื่อพิมพ์คำถาม';
    micStatus.textContent=value?'กำลังฟังภาษาไทย... กดไมโครโฟนอีกครั้งเพื่อหยุด':speechError;
  }
  function stopListening(){if(recognition&&listening){try{recognition.stop()}catch(_){}setListening(false)}}
  if(!SpeechAPI){micButton.disabled=true;micButton.title='เบราว์เซอร์นี้ไม่รองรับการแปลงเสียงเป็นข้อความ';}
  micButton.addEventListener('click',()=>{
    if(listening){stopListening();return}
    if(sending){toast('โปรดรอให้ตอบคำถามเสร็จก่อน');return}
    if(!SpeechAPI){toast('เบราว์เซอร์นี้ไม่รองรับไมโครโฟนสำหรับพิมพ์ด้วยเสียง');return}
    if(!window.isSecureContext){
      toast('การพูดผ่านไมโครโฟนต้องเปิดเว็บด้วย HTTPS หรือ localhost');
      micStatus.textContent='โปรดตั้งค่า HTTPS ก่อนเปิดใช้ไมโครโฟน';return;
    }
    speechError='';dictationBase=question.value.trim();lastTranscript='';
    try{
      recognition=new SpeechAPI();recognition.lang='th-TH';recognition.continuous=false;
      recognition.interimResults=true;recognition.maxAlternatives=1;
      recognition.onstart=()=>setListening(true);
      recognition.onresult=(event)=>{
        let parts=[];
        for(let i=0;i<event.results.length;i++){
          const words=event.results[i][0]?.transcript||'';if(words.trim())parts.push(words.trim());
        }
        lastTranscript=parts.join(' ').trim();
        question.value=[dictationBase,lastTranscript].filter(Boolean).join(' ');
        resize();
      };
      recognition.onerror=(event)=>{
        const messages={
          'not-allowed':'ไม่ได้รับอนุญาตให้ใช้ไมโครโฟน โปรดอนุญาตในเบราว์เซอร์',
          'service-not-allowed':'เบราว์เซอร์ไม่อนุญาตให้ใช้บริการรู้จำเสียง',
          'audio-capture':'ไม่พบไมโครโฟน หรือกำลังถูกโปรแกรมอื่นใช้งาน',
          'network':'ระบบแปลงเสียงมีปัญหาการเชื่อมต่ออินเทอร์เน็ต',
          'no-speech':'ไม่ได้ยินเสียงพูด กรุณาลองใหม่',
          'language-not-supported':'เบราว์เซอร์นี้ยังไม่รองรับการฟังภาษาไทย',
        };
        if(event.error!=='aborted'){
          speechError=messages[event.error]||'ไม่สามารถแปลงเสียงได้ โปรดลองอีกครั้ง';
          toast(speechError);
        }
      };
      recognition.onend=()=>{
        setListening(false);
        if(lastTranscript){micStatus.textContent='แปลงเสียงเป็นข้อความแล้ว ตรวจสอบคำถามก่อนกดส่ง';question.focus()}
        else if(!speechError)micStatus.textContent='หยุดฟังแล้ว';
      };
      recognition.start();
    }catch(err){setListening(false);toast('เริ่มไมโครโฟนไม่ได้ โปรดลองใช้ Chrome หรือ Edge ผ่าน HTTPS')}
  });

  question.addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();$('form').requestSubmit()}});
  async function api(action,body={},method='GET'){
    let url='api/chat.php?action='+encodeURIComponent(action);
    const headers={'Accept':'application/json','X-MBS-User':userId};
    const options={method,headers,cache:'no-store',credentials:'same-origin'};
    if(method==='GET')url+='&'+new URLSearchParams(body);
    else{headers['Content-Type']='application/json';options.body=JSON.stringify(body)}
    let response;try{response=await fetch(url,options)}catch{throw Error('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ กรุณาตรวจสอบ PHP และเครือข่าย')}
    if(!response.ok){const error=await response.json().catch(()=>({}));throw Error(error.error||'เซิร์ฟเวอร์ตอบกลับ HTTP '+response.status)}
    if(action==='send')return response;
    const data=await response.json().catch(()=>null);
    if(!data)throw Error('เซิร์ฟเวอร์ไม่ได้ตอบข้อมูล JSON');return data;
  }
  function groupName(unix){
    if(!unix)return 'ก่อนหน้านี้';
    const date=new Date(Number(unix)*(Number(unix)>1e11?1:1000));
    if(Number.isNaN(date.getTime()))return 'ก่อนหน้านี้';
    const now=new Date();const d=new Date(now.getFullYear(),now.getMonth(),now.getDate());
    if(date>=d)return 'วันนี้';
    if(date>=new Date(d.getTime()-86400000))return 'เมื่อวาน';
    if(date>=new Date(d.getTime()-6*86400000))return '7 วันที่ผ่านมา';
    return 'ก่อนหน้านี้';
  }
  function list(){
    history.replaceChildren();const term=$('search').value.toLocaleLowerCase('th').trim();
    const filtered=conversations.filter(c=>(c.name||'').toLocaleLowerCase('th').includes(term));
    if(!filtered.length){const p=document.createElement('p');p.className='hint-empty';p.textContent=term?'ไม่พบชื่อแชทที่ค้นหา':displayError||'ยังไม่มีประวัติการสนทนา เริ่มแชทใหม่ได้เลยค่ะ';history.append(p);return}
    let lastGroup='';
    for(const c of filtered){
      const group=groupName(c.updated_at||c.created_at);
      if(group!==lastGroup){lastGroup=group;const label=document.createElement('div');label.className='section-title';label.textContent=group;history.append(label)}
      const row=document.createElement('div');row.className='history-row'+(c.id===current?' active':'');
      const open=document.createElement('button');open.className='history-open';open.type='button';open.textContent=c.name||'บทสนทนาใหม่';open.title=c.name||'บทสนทนาใหม่';open.onclick=()=>openHistory(c.id);
      const more=document.createElement('button');more.className='more-button';more.type='button';more.title='เปลี่ยนชื่อหรือลบ';more.setAttribute('aria-label','จัดการบทสนทนา '+(c.name||''));more.textContent='⋯';more.onclick=()=>optionsFor(c);
      row.append(open,more);history.append(row);
    }
  }
  $('search').addEventListener('input',list);
  async function refreshHistory(){
    const found=[],ids=new Set();let last='';
    for(let i=0;i<15;i++){
      const params={limit:100};if(last)params.last_id=last;
      const answer=await api('list',params);
      const items=Array.isArray(answer.data)?answer.data:[];
      for(const item of items){if(item.id&&!ids.has(item.id)){found.push(item);ids.add(item.id)}}
      if(!answer.has_more||!items.length)break;
      const next=items[items.length-1].id;if(!next||next===last)break;last=next;
    }
    conversations=found;displayError='';list();
    if(current){const one=conversations.find(c=>c.id===current);if(one)$('currentTitle').textContent=one.name||'บทสนทนา'}
  }
  async function openHistory(id){
    if(sending)return;stopListening();
    const epoch=++loadEpoch;current=id;side(false);list();$('currentTitle').textContent=conversations.find(c=>c.id===id)?.name||'บทสนทนา';
    chat.replaceChildren();const loading=bubble('assistant','กำลังเปิดประวัติการสนทนา...');loading.node.classList.add('thinking');
    try{
      const found=[],seen=new Set();let cursor='';
      for(let page=0;page<25;page++){
        const params={conversation_id:id,limit:100};if(cursor)params.first_id=cursor;
        const result=await api('messages',params);
        const items=Array.isArray(result.data)?result.data:[];
        for(const m of items){if(m.id&&!seen.has(m.id)){seen.add(m.id);found.push(m)}}
        if(!result.has_more||!items.length)break;
        const next=items[0].id;if(!next||next===cursor)break;cursor=next;
      }
      if(epoch!==loadEpoch)return;
      chat.replaceChildren();
      found.reverse().forEach(m=>{if(m.query)bubble('user',m.query,false);if(m.answer)finishedAnswer(bubble('assistant',m.answer,false))});
      if(!found.length)bubble('assistant','ยังไม่มีข้อความในบทสนทนานี้');
      scrollBottom(true);
    }catch(err){if(epoch!==loadEpoch)return;loading.body.textContent='เปิดประวัติไม่สำเร็จ: '+err.message;toast(err.message)}
  }
  function newChat(){
    if(sending)return;stopListening();micStatus.textContent='';
    ++loadEpoch;current='';question.value='';resize();welcome();list();side(false);if(!mobile())question.focus();
  }
  $('newSidebar').onclick=newChat;$('newTop').onclick=newChat;
  function askDialog(type,c){return new Promise(resolve=>{
    const d=$('dialog');$('dialogTitle').textContent=type==='rename'?'เปลี่ยนชื่อบทสนทนา':'ลบบทสนทนา';
    $('dialogMessage').textContent=type==='rename'?'ตั้งชื่อใหม่ให้บทสนทนานี้':'ยืนยันลบบทสนทนานี้หรือไม่? เมื่อลบแล้วจะกู้คืนไม่ได้';
    $('dialogInput').hidden=type!=='rename';$('dialogInput').value=c.name||'';
    $('dialogOK').textContent=type==='rename'?'บันทึก':'ลบ';$('dialogOK').className='dialog-button '+(type==='rename'?'primary':'danger');
    let finished=false;const close=value=>{if(finished)return;finished=true;d.close();resolve(value)};
    const cancel=()=>close(null);const ok=()=>close(type==='rename'?$('dialogInput').value.trim():true);
    $('dialogCancel').onclick=cancel;$('dialogOK').onclick=ok;
    $('dialogInput').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();ok()}};
    d.oncancel=e=>{e.preventDefault();cancel()};d.showModal();if(type==='rename')$('dialogInput').focus();
  })}
  async function optionsFor(c){
    if(sending)return;
    const pick=await new Promise(resolve=>{
      const menu=document.createElement('div');
      menu.className='options-popup';
      const row=[['เปลี่ยนชื่อ','rename'],['ลบบทสนทนา','delete']];
      const target=document.activeElement.getBoundingClientRect();menu.style.left=Math.min(window.innerWidth-170,Math.max(8,target.left-112))+'px';menu.style.top=Math.min(window.innerHeight-104,target.bottom+3)+'px';
      let closed=false;const close=value=>{if(closed)return;closed=true;document.removeEventListener('pointerdown',outside,true);menu.remove();resolve(value)};
      const outside=e=>{if(!menu.contains(e.target))close(null)};
      for(const [label,type] of row){const b=document.createElement('button');b.type='button';b.textContent=label;if(type==='delete')b.classList.add('delete-option');b.onclick=()=>close(type);menu.append(b)}
      document.body.append(menu);setTimeout(()=>document.addEventListener('pointerdown',outside,true),0);
    });
    if(!pick)return;
    const result=await askDialog(pick,c);if(result===null)return;
    try{
      if(pick==='rename'){
        if(!result){toast('กรุณาระบุชื่อบทสนทนา');return}
        await api('rename',{conversation_id:c.id,name:result},'POST');toast('เปลี่ยนชื่อแล้ว');
      }else{
        await api('delete',{conversation_id:c.id},'POST');if(current===c.id)newChat();toast('ลบบทสนทนาแล้ว');
      }
      await refreshHistory();
    }catch(e){toast('ดำเนินการไม่สำเร็จ: '+e.message)}
  }
  async function readStream(response,entry){
    if(!response.body)throw Error('เบราว์เซอร์ไม่รองรับการรับคำตอบแบบต่อเนื่อง');
    const reader=response.body.getReader(),decoder=new TextDecoder();let buffer='',total='',ended=false,nextId='';
    while(true){
      const {value,done}=await reader.read();if(done)break;
      buffer+=decoder.decode(value,{stream:true}).replace(/\r\n/g,'\n');
      let index;
      while((index=buffer.indexOf('\n\n'))!==-1){
        const block=buffer.slice(0,index);buffer=buffer.slice(index+2);
        const data=block.split('\n').filter(line=>line.startsWith('data:')).map(line=>line.slice(5).trimStart()).join('\n');
        if(!data||data==='[DONE]')continue;
        let event;try{event=JSON.parse(data)}catch{continue}
        if(event.conversation_id)nextId=event.conversation_id;
        if(event.event==='error')throw Error(event.message||'Dify ไม่สามารถตอบคำถามได้');
        if(event.event==='message'||event.event==='agent_message'){
          if(typeof event.answer==='string'){total+=event.answer;entry.body.textContent=total;entry.node.classList.remove('thinking');scrollBottom()}
        }else if(event.event==='message_replace'){
          total=typeof event.answer==='string'?event.answer:total;entry.body.textContent=total;scrollBottom();
        }else if(event.event==='message_end')ended=true;
      }
    }
    // Some networks buffer the full SSE response; process an unterminated final event defensively.
    if(buffer.startsWith('data:')){
      try{const e=JSON.parse(buffer.slice(5).trim());if(e.conversation_id)nextId=e.conversation_id;if(e.event==='error')throw Error(e.message||'Dify มีข้อผิดพลาด');if(e.event==='message'&&e.answer){total+=e.answer;entry.body.textContent=total}}catch(e){if(e.message&&e.message!=='Unexpected end of JSON input'&&e.name!=='SyntaxError')throw e}
    }
    if(!total&&!ended)throw Error('ไม่ได้รับคำตอบจาก Dify กรุณาตรวจสอบการเชื่อมต่อ');
    if(!total)entry.body.textContent='Dify ประมวลผลเสร็จแล้ว แต่ไม่ได้ส่งข้อความคำตอบกลับมา';
    entry.node.classList.remove('thinking');return nextId;
  }
  $('form').addEventListener('submit',async event=>{
    event.preventDefault();const text=question.value.trim();if(!text||sending)return;stopListening();micStatus.textContent='';
    question.value='';resize();
    if(!current)chat.replaceChildren();
    bubble('user',text);const waiting=bubble('assistant','กำลังค้นหาข้อมูลและเรียบเรียงคำตอบ');waiting.node.classList.add('thinking');waiting.body.classList.add('dots');
    setBusy(true);scrollBottom(true);
    try{
      const response=await api('send',{query:text,conversation_id:current},'POST');
      waiting.body.classList.remove('dots');waiting.body.textContent='กำลังสร้างคำตอบ...';
      const id=await readStream(response,waiting);if(id)current=id;
      finishedAnswer(waiting);
      try{await refreshHistory()}catch(err){toast('ตอบแล้ว แต่โหลดประวัติไม่สำเร็จ: '+err.message)}
      setTimeout(()=>refreshHistory().catch(()=>{}),1300);
    }catch(err){waiting.node.classList.remove('thinking');waiting.body.classList.remove('dots');waiting.body.textContent='เกิดข้อผิดพลาด: '+err.message;toast('ส่งคำถามไม่สำเร็จ: '+err.message)}
    finally{setBusy(false);scrollBottom(true);if(!mobile())question.focus()}
  });
  $('fullscreen').onclick=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch{toast('เบราว์เซอร์นี้ไม่อนุญาตให้เปิดเต็มหน้าจอ')}};
  welcome();resize();
  (async()=>{
    try{
      const health=await api('health');
      if(!health.ready)throw Error(health.message||'เซิร์ฟเวอร์ยังไม่พร้อม');
      $('statusDot').classList.add('ready');$('statusText').textContent='พร้อมให้บริการ';
      await refreshHistory();loaded=true;
    }catch(e){displayError='ยังเชื่อมต่อ Dify ไม่ได้';list();$('statusText').textContent='ยังไม่ได้เชื่อมต่อ';$('statusAlert').textContent=e.message+' — โปรดตรวจสอบ api/config.php';$('statusAlert').classList.add('visible')}
  })();
</script>
